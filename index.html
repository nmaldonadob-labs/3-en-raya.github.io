<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tres en raya online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tres en raya</h1>

    <!-- Pantalla de inicio -->
    <section id="menu">
      <button id="btn-local">Jugar en esta pantalla</button>
      <button id="btn-online">Crear partida online</button>
    </section>

    <!-- Pantalla de juego -->
    <section id="juego" hidden>
      <p id="info">Conectando…</p>

      <div id="compartir" hidden>
        <p>Envía este enlace a tu rival:</p>
        <div class="fila">
          <input id="enlace" readonly>
          <button id="btn-copiar">Copiar</button>
        </div>
      </div>

      <div id="tablero"></div>

      <p id="estado"></p>
      <button id="btn-revancha" hidden>Revancha</button>
    </section>
  </main>

  <!-- PeerJS: conexión directa entre los dos navegadores -->
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
